name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements-build.txt
      - run: pip install pytest
      - name: Tests
        run: python -m pytest -q
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"',open('clipper/sysutil.py').read()).group(1))")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION v$V"; exit 1; }
      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name Clipper run.py --noconfirm \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av \
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all pip
      - name: Build windowed variant (no console window)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name Clipper-windowed run.py --noconfirm \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av \
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all pip
      - uses: actions/upload-artifact@v7
        with:
          name: Clipper-${{ runner.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
